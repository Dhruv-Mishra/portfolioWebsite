name: CI

on:
  pull_request:
  push:
    branches: [dev/lkg]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio
    env:
      SKIP_EMBEDDINGS_BUILD: '1'
      ONNXRUNTIME_NODE_INSTALL: skip
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: |
          npm_cmd=(npx -y npm@10.9.8)

          if ! "${npm_cmd[@]}" ci --dry-run >/dev/null 2>&1; then
            echo "::error::Lockfile out of sync with package.json. Regenerate locally with: cd portfolio && npx -y npm@10.9.8 install --package-lock-only --include=optional"
            "${npm_cmd[@]}" ci --dry-run
            exit 1
          fi
          "${npm_cmd[@]}" ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio
    env:
      SKIP_EMBEDDINGS_BUILD: '1'
      ONNXRUNTIME_NODE_INSTALL: skip
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: |
          npm_cmd=(npx -y npm@10.9.8)

          if ! "${npm_cmd[@]}" ci --dry-run >/dev/null 2>&1; then
            echo "::error::Lockfile out of sync with package.json. Regenerate locally with: cd portfolio && npx -y npm@10.9.8 install --package-lock-only --include=optional"
            "${npm_cmd[@]}" ci --dry-run
            exit 1
          fi
          "${npm_cmd[@]}" ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portfolio
    env:
      SKIP_EMBEDDINGS_BUILD: '1'
      ONNXRUNTIME_NODE_INSTALL: skip
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: |
          npm_cmd=(npx -y npm@10.9.8)

          if ! "${npm_cmd[@]}" ci --dry-run >/dev/null 2>&1; then
            echo "::error::Lockfile out of sync with package.json. Regenerate locally with: cd portfolio && npx -y npm@10.9.8 install --package-lock-only --include=optional"
            "${npm_cmd[@]}" ci --dry-run
            exit 1
          fi
          "${npm_cmd[@]}" ci

      - name: Test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: portfolio
    env:
      SKIP_EMBEDDINGS_BUILD: '1'
      ONNXRUNTIME_NODE_INSTALL: skip
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: |
          npm_cmd=(npx -y npm@10.9.8)

          if ! "${npm_cmd[@]}" ci --dry-run >/dev/null 2>&1; then
            echo "::error::Lockfile out of sync with package.json. Regenerate locally with: cd portfolio && npx -y npm@10.9.8 install --package-lock-only --include=optional"
            "${npm_cmd[@]}" ci --dry-run
            exit 1
          fi
          "${npm_cmd[@]}" ci

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            portfolio/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('portfolio/package-lock.json') }}-${{ hashFiles('portfolio/**/*.{js,jsx,ts,tsx,css}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('portfolio/package-lock.json') }}-

      - name: Build
        run: npm run build
