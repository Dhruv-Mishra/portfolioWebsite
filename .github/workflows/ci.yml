name: CI

on:
  pull_request:
  push:
    branches: [dev/lkg]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SKIP_EMBEDDINGS_BUILD: '1'
  NEXT_TELEMETRY_DISABLED: '1'

# Job names are referenced by branch protection; keep them stable.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-portfolio
      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: portfolio/.eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('portfolio/package-lock.json', 'portfolio/eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-eslint-${{ hashFiles('portfolio/package-lock.json', 'portfolio/eslint.config.mjs') }}-
      - run: npm run lint -- --cache --cache-location .eslintcache

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-portfolio
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-portfolio
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-portfolio
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: portfolio/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('portfolio/package-lock.json') }}-${{ hashFiles('portfolio/**/*.{js,jsx,ts,tsx,css}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('portfolio/package-lock.json') }}-
      - run: npm run build
