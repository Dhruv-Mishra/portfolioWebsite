name: Deploy Portfolio Staging

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:

  push:
    branches:
      - deployed/staging
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "StagingDeploymentPrompt.md"
      - "docs/**"
      - "portfolio/README.md"
      - "portfolio/projectContext.md"
      - "portfolio/**/AGENTS.md"
      - ".github/dependabot.yml"
      - ".github/agents/**"
      - ".github/instructions/**"
      - "LICENSE"
      - "ResumeBuilder/**"

concurrency:
  group: deploy-staging-portfolio-staging
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  STAGING_SITE: portfolio-staging
  STAGING_DOMAIN: staging.whoisdhruv.com
  STAGING_PORT: "3010"
  NODE_VERSION: "22"
  CI_NPM_VERSION: "10.9.8"
  DEPLOY_MODE: image
  DEPLOY_BROWSERSLIST: last 2 Chrome versions, last 2 Firefox versions, last 2 Safari versions, last 2 Edge versions
  NEXT_PUBLIC_GA_ID: ""
  NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
  NEXT_PUBLIC_ENABLE_ERROR_TRACKING: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  guard-staging-ref:
    name: Guard staging ref
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      STAGING_CHAT_HISTORY_SIGNING_SECRET: ${{ secrets.STAGING_CHAT_HISTORY_SIGNING_SECRET }}
      STAGING_MATRIX_NOTES_ACCESS_SECRET: ${{ secrets.STAGING_MATRIX_NOTES_ACCESS_SECRET }}

    steps:
      - name: Require experimental branch for staging deploys
        run: |
          if [ "${{ github.ref }}" != "refs/heads/deployed/staging" ]; then
            echo "::error::Staging deploys must run from refs/heads/deployed/staging, not ${{ github.ref }}"
            exit 1
          fi

      - name: Preflight required staging runtime secrets
        shell: bash
        run: |
          missing=0
          if [[ ! "${STAGING_CHAT_HISTORY_SIGNING_SECRET:-}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::STAGING_CHAT_HISTORY_SIGNING_SECRET must be configured as exactly 64 hexadecimal characters"
            missing=1
          fi
          if [[ ! "${STAGING_MATRIX_NOTES_ACCESS_SECRET:-}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::STAGING_MATRIX_NOTES_ACCESS_SECRET must be configured as exactly 64 hexadecimal characters"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            exit 1
          fi

  build:
    name: Build staging artifact and image
    needs: guard-staging-ref
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image-meta.outputs.image }}
      image_digest: ${{ steps.docker-build.outputs.digest }}
      image_ref: ${{ steps.image-meta.outputs.image }}@${{ steps.docker-build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: portfolio/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: portfolio/.next/cache
          key: nextjs-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('portfolio/package-lock.json') }}-${{ hashFiles('portfolio/**/*.[jt]s', 'portfolio/**/*.[jt]sx', 'portfolio/**/*.css', 'portfolio/next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('portfolio/package-lock.json') }}-
            nextjs-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies
        working-directory: portfolio
        env:
          SKIP_EMBEDDINGS_BUILD: "1"
        run: |
          npm_cmd=(npx -y npm@${{ env.CI_NPM_VERSION }})

          if ! "${npm_cmd[@]}" ci --dry-run >/dev/null 2>&1; then
            echo "::error::Lockfile out of sync with package.json. Regenerate locally with: cd portfolio && npx -y npm@${{ env.CI_NPM_VERSION }} install --package-lock-only --include=optional"
            "${npm_cmd[@]}" ci --dry-run
            exit 1
          fi
          "${npm_cmd[@]}" ci

      - name: Lint
        working-directory: portfolio
        run: npm run lint

      - name: Typecheck
        working-directory: portfolio
        run: npm run typecheck

      - name: Test
        working-directory: portfolio
        run: npm test

      - name: Build Next.js (standalone)
        working-directory: portfolio
        env:
          SKIP_EMBEDDINGS_BUILD: "1"
          NEXT_BUILD_ID: ${{ github.sha }}
          NODE_OPTIONS: "--max-old-space-size=4096"
          BROWSERSLIST: ${{ env.DEPLOY_BROWSERSLIST }}
        run: npm run build -- --webpack

      - name: Verify portable standalone artifact
        working-directory: portfolio
        run: |
          if find .next/standalone -type d -name '.cache' -print -quit | grep -q .; then
            echo "::error::Standalone output contains a traced local cache directory"
            find .next/standalone -type d -name '.cache' -print
            exit 1
          fi
          if find .next/standalone -type f \( -name '*.node' -o -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) -print -quit | grep -q .; then
            echo "::error::Standalone output contains a platform-specific native binary"
            find .next/standalone -type f \( -name '*.node' -o -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) -print
            exit 1
          fi

      - name: Assemble standalone bundle
        working-directory: portfolio
        run: |
          set -euo pipefail

          cp -r .next/static .next/standalone/.next/
          cp -r public        .next/standalone/

          mkdir -p .next/standalone/.deploy
          cp scripts/deploy.sh          .next/standalone/.deploy/
          cp nginx-cloudflare.conf      .next/standalone/.deploy/
          chmod +x .next/standalone/.deploy/deploy.sh

          cat > .next/standalone/.deploy/meta.json <<META
          {
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "actor": "${{ github.actor }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}"
          }
          META

          tar czf ../portfolio-${{ github.sha }}.tar.gz -C .next/standalone .
          ls -lh ../portfolio-${{ github.sha }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-bundle
          path: portfolio-${{ github.sha }}.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Resolve image name
        id: image-meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: env.DEPLOY_MODE == 'image'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.DEPLOY_MODE == 'image'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: env.DEPLOY_MODE == 'image'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: env.DEPLOY_MODE == 'image'
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: portfolio
          file: portfolio/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image-meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_BUILD_ID=${{ github.sha }}
            NEXT_PUBLIC_GA_ID=${{ env.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_SITE_URL=https://${{ env.STAGING_DOMAIN }}
            NEXT_PUBLIC_ENABLE_ANALYTICS=${{ env.NEXT_PUBLIC_ENABLE_ANALYTICS }}
            NEXT_PUBLIC_ENABLE_ERROR_TRACKING=${{ env.NEXT_PUBLIC_ENABLE_ERROR_TRACKING }}
            NEXT_BUILD_FLAGS=--webpack
            BROWSERSLIST_QUERY=${{ env.DEPLOY_BROWSERSLIST }}

      - name: Verify published Docker image platforms
        if: env.DEPLOY_MODE == 'image'
        run: |
          set -euo pipefail
          image_ref="${{ steps.image-meta.outputs.image }}@${{ steps.docker-build.outputs.digest }}"
          platforms="$(docker buildx imagetools inspect "${image_ref}" | awk '/^[[:space:]]*Platform: / { print $2 }')"
          printf '%s\n' "${platforms}"
          for platform in linux/amd64 linux/arm64; do
            if ! grep -Fxq "${platform}" <<< "${platforms}"; then
              echo "::error::Published image ${image_ref} is missing required platform ${platform}"
              exit 1
            fi
          done

      - name: Build summary
        run: |
          SIZE=$(ls -l portfolio-${{ github.sha }}.tar.gz | awk '{print $5}')
          SIZE_MB=$(( SIZE / 1024 / 1024 ))
          echo "## Staging build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | portfolio-${{ github.sha }}.tar.gz |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.DEPLOY_MODE }}" = "image" ]; then
            echo "| Image | ${{ steps.image-meta.outputs.image }}@${{ steps.docker-build.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Image | skipped (artifact deploy mode) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Size | ${SIZE_MB} MB |" >> $GITHUB_STEP_SUMMARY

  preflight-staging:
    name: Preflight ${{ matrix.server.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      fail-fast: false
      matrix:
        server:
          - name: staging-1
            tts_mode: local
            environment: production-1
            host_secret: SERVER_HOST_1
            user_secret: SERVER_USERNAME_1
            key_secret: SERVER_SSH_KEY_1
            port_secret: SERVER_PORT_1
          - name: staging-2
            tts_mode: remote
            environment: production-2
            host_secret: SERVER_HOST_2
            user_secret: SERVER_USERNAME_2
            key_secret: SERVER_SSH_KEY_2
            port_secret: SERVER_PORT_2
          - name: staging-3
            tts_mode: remote
            environment: production-3
            host_secret: SERVER_HOST_3
            user_secret: SERVER_USERNAME_3
            key_secret: SERVER_SSH_KEY_3
            port_secret: SERVER_PORT_3

    environment:
      name: ${{ matrix.server.environment }}

    steps:
      - name: Validate staging SSH secrets
        run: |
          missing=0
          if [ -z "${{ secrets[matrix.server.host_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.host_secret }} not configured for ${{ matrix.server.name }}"
            missing=1
          fi
          if [ -z "${{ secrets[matrix.server.user_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.user_secret }} not configured for ${{ matrix.server.name }}"
            missing=1
          fi
          if [ -z "${{ secrets[matrix.server.key_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.key_secret }} not configured for ${{ matrix.server.name }}"
            missing=1
          fi
          if [ -z "${{ secrets[matrix.server.port_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.port_secret }} not configured for ${{ matrix.server.name }}"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            exit 1
          fi

      - name: Warn when GHCR token is absent
        if: env.DEPLOY_MODE == 'image'
        run: |
          if [ -z "${{ secrets.GHCR_READ_TOKEN }}" ]; then
            echo "::warning::GHCR_READ_TOKEN is not configured for ${{ matrix.server.name }}. This is only OK if the GHCR package is public or the VM already has pull access."
          fi

      - name: Validate staging VM contract
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          command_timeout: 3m
          script: |
            set -euo pipefail

            SITE="${{ env.STAGING_SITE }}"
            DOMAIN="${{ env.STAGING_DOMAIN }}"
            PORT="${{ env.STAGING_PORT }}"
            EXPECTED_TTS_MODE="${{ matrix.server.tts_mode }}"
            CONF="/etc/deploy/sites/${SITE}.conf"
            PROD_CONF="/etc/deploy/sites/portfolio.conf"
            MACHINE_CONF="/etc/deploy/machine.conf"
            ENV_FILE="/opt/${SITE}/config/.env.local"

            fail() {
              echo "ERROR: $*" >&2
              exit 1
            }

            read_conf() {
              local key="$1"
              sudo awk -F= -v k="$key" '$1 == k { value=$2; gsub(/^[ \t\"]+|[ \t\"]+$/, "", value); print value; exit }' "$CONF"
            }

            read_env() {
              local key="$1"
              sudo awk -F= -v k="$key" '$1 == k { value=$2; gsub(/^[ \t\"]+|[ \t\"]+$/, "", value); print value; exit }' "$ENV_FILE"
            }

            read_machine_conf() {
              local key="$1"
              sudo awk -F= -v k="$key" '$1 == k { value=$2; gsub(/^[ \t\"]+|[ \t\"]+$/, "", value); print value; exit }' "$MACHINE_CONF"
            }

            sudo test -f "$CONF" || fail "missing staging site config: $CONF"
            [ "$CONF" != "$PROD_CONF" ] || fail "staging config path resolves to production config"

            actual_domain="$(read_conf DOMAIN)"
            actual_service="$(read_conf SERVICE_NAME)"
            actual_port="$(read_conf NEXTJS_PORT)"
            actual_container="$(read_conf DOCKER_CONTAINER_NAME)"
            actual_branch="$(read_conf GIT_BRANCH)"
            actual_tts_mode="$(read_conf TTS_NODE_MODE)"

            [ "$actual_domain" = "$DOMAIN" ] || fail "DOMAIN must be $DOMAIN, got ${actual_domain:-unset}"
            [ "$actual_service" = "$SITE" ] || fail "SERVICE_NAME must be $SITE, got ${actual_service:-unset}"
            [ "$actual_port" = "$PORT" ] || fail "NEXTJS_PORT must be $PORT, got ${actual_port:-unset}"
            [ -z "$actual_container" ] || [ "$actual_container" = "$SITE" ] || fail "DOCKER_CONTAINER_NAME must be $SITE, got $actual_container"
            [ "$actual_branch" = "deployed/staging" ] || fail "GIT_BRANCH must be deployed/staging, got ${actual_branch:-unset}"
            [ "$actual_tts_mode" = "$EXPECTED_TTS_MODE" ] || fail "TTS_NODE_MODE must match matrix role $EXPECTED_TTS_MODE, got ${actual_tts_mode:-unset}"

            tts_token="$(read_conf TTS_BACKEND_TOKEN)"
            [[ "$tts_token" =~ ^[A-Za-z0-9_-]{32,128}$ ]] || fail "TTS_BACKEND_TOKEN is missing or malformed"

            sudo test -f "$ENV_FILE" || fail "missing staging env file: $ENV_FILE"
            next_public_site_url="$(read_env NEXT_PUBLIC_SITE_URL)"
            site_url="$(read_env SITE_URL)"
            [ "$next_public_site_url" = "https://${DOMAIN}" ] || fail "NEXT_PUBLIC_SITE_URL must be https://${DOMAIN}, got ${next_public_site_url:-unset}"
            [ "$site_url" = "https://${DOMAIN}" ] || fail "SITE_URL must be https://${DOMAIN}, got ${site_url:-unset}"
            command -v docker >/dev/null 2>&1 || fail "docker is not installed"
            sudo docker info >/dev/null || fail "docker daemon is not reachable"
            command -v nginx >/dev/null 2>&1 || fail "nginx is not installed"
            sudo nginx -t

            sudo test -f "$MACHINE_CONF" || fail "missing machine config: $MACHINE_CONF"
            memory_high_mb="$(read_machine_conf MEMORY_HIGH_MB)"
            memory_max_mb="$(read_machine_conf MEMORY_MAX_MB)"
            [[ "$memory_high_mb" =~ ^[0-9]+$ ]] || fail "MEMORY_HIGH_MB must be numeric, got ${memory_high_mb:-unset}"
            [[ "$memory_max_mb" =~ ^[0-9]+$ ]] || fail "MEMORY_MAX_MB must be numeric, got ${memory_max_mb:-unset}"
            physical_memory_mb="$(awk '/^MemTotal:/ { print int($2 / 1024) }' /proc/meminfo)"
            [[ "$physical_memory_mb" =~ ^[0-9]+$ ]] || fail "could not determine physical memory"

            if [ "$EXPECTED_TTS_MODE" = "local" ]; then
              (( memory_high_mb >= 1200 )) || fail "local TTS requires MEMORY_HIGH_MB >= 1200, got $memory_high_mb"
              (( memory_max_mb >= 1536 )) || fail "local TTS requires MEMORY_MAX_MB >= 1536, got $memory_max_mb"
              (( physical_memory_mb >= 1900 )) || fail "local Pocket TTS requires about 2 GB physical RAM; detected ${physical_memory_mb} MB"
              private_listen="$(read_conf TTS_PRIVATE_LISTEN)"
              allowed_clients="$(read_conf TTS_ALLOWED_CLIENTS)"
              [[ "$private_listen" =~ ^(10\.[0-9.]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9.]+|192\.168\.[0-9.]+):[0-9]{1,5}$ ]] || fail "TTS_PRIVATE_LISTEN must be a private IPv4 address and port"
              [ -n "$allowed_clients" ] || fail "TTS_ALLOWED_CLIENTS must be configured"
              private_ip="${private_listen%:*}"
              ip -4 -o addr show | awk '{print $4}' | cut -d/ -f1 | grep -Fxq "$private_ip" || fail "TTS_PRIVATE_LISTEN address is not assigned to this VM"
            else
              (( memory_high_mb >= 400 )) || fail "remote TTS requires MEMORY_HIGH_MB >= 400, got $memory_high_mb"
              (( memory_max_mb >= 500 )) || fail "remote TTS requires MEMORY_MAX_MB >= 500, got $memory_max_mb"
              (( physical_memory_mb >= 900 )) || fail "remote node requires at least 900 MB physical RAM; detected ${physical_memory_mb} MB"
              backend_url="$(read_conf TTS_BACKEND_URL)"
              [[ "$backend_url" =~ ^http://(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9.]+:[0-9]{1,5}$ ]] || fail "TTS_BACKEND_URL must be an exact private HTTP IPv4 endpoint"
            fi

            if ss -tln "sport = :${PORT}" 2>/dev/null | grep -q LISTEN; then
              sudo systemctl is-active --quiet "$SITE" || fail "port ${PORT} is in use, but ${SITE}.service is not active"
            fi

            echo "Staging VM contract OK: ${SITE} (${DOMAIN}) on :${PORT}; TTS ${EXPECTED_TTS_MODE}; memory ${memory_high_mb}/${memory_max_mb} MB, host ${physical_memory_mb} MB"

  deploy-staging:
    name: Deploy to ${{ matrix.server.name }}
    needs:
      - build
      - preflight-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        server:
          - name: staging-1
            tts_mode: local
            environment: production-1
            host_secret: SERVER_HOST_1
            user_secret: SERVER_USERNAME_1
            key_secret: SERVER_SSH_KEY_1
            port_secret: SERVER_PORT_1
            ghcr_secret: GHCR_READ_TOKEN
          - name: staging-2
            tts_mode: remote
            environment: production-2
            host_secret: SERVER_HOST_2
            user_secret: SERVER_USERNAME_2
            key_secret: SERVER_SSH_KEY_2
            port_secret: SERVER_PORT_2
            ghcr_secret: GHCR_READ_TOKEN
          - name: staging-3
            tts_mode: remote
            environment: production-3
            host_secret: SERVER_HOST_3
            user_secret: SERVER_USERNAME_3
            key_secret: SERVER_SSH_KEY_3
            port_secret: SERVER_PORT_3
            ghcr_secret: GHCR_READ_TOKEN

    environment:
      name: ${{ matrix.server.environment }}

    steps:
      - name: Staging deployment started (${{ matrix.server.name }})
        run: |
          echo "## Staging deployment — ${{ matrix.server.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Site | ${{ env.STAGING_SITE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://${{ env.STAGING_DOMAIN }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | ${{ env.DEPLOY_MODE }} |" >> $GITHUB_STEP_SUMMARY

      - name: Download build artifact
        if: env.DEPLOY_MODE == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: portfolio-bundle

      - name: Copy artifact to staging VM
        if: env.DEPLOY_MODE == 'artifact'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          source: portfolio-${{ github.sha }}.tar.gz
          target: /tmp/
          timeout: 60s
          command_timeout: 3m

      - name: Checkout deploy kit
        if: env.DEPLOY_MODE == 'image'
        uses: actions/checkout@v4

      - name: Package deploy kit
        if: env.DEPLOY_MODE == 'image'
        run: |
          set -euo pipefail
          mkdir -p deploy-kit
          cp portfolio/scripts/deploy.sh deploy-kit/deploy.sh
          cp portfolio/nginx-cloudflare.conf deploy-kit/nginx-cloudflare.conf
          cp portfolio/scripts/machine.conf.example deploy-kit/machine.conf.example
          cp portfolio/scripts/portfolio.conf.example deploy-kit/portfolio.conf.example
          tar czf portfolio-deploy-kit-${{ github.sha }}.tar.gz -C deploy-kit .

      - name: Copy deploy kit to staging VM
        if: env.DEPLOY_MODE == 'image'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          source: portfolio-deploy-kit-${{ github.sha }}.tar.gz
          target: /tmp/
          timeout: 60s
          command_timeout: 3m

      - name: Deploy on ${{ matrix.server.name }}
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets[matrix.server.ghcr_secret] }}
          RUNTIME_CHAT_HISTORY_SIGNING_SECRET: ${{ secrets.STAGING_CHAT_HISTORY_SIGNING_SECRET }}
          RUNTIME_MATRIX_NOTES_ACCESS_SECRET: ${{ secrets.STAGING_MATRIX_NOTES_ACCESS_SECRET }}
          RUNTIME_HF_TOKEN: ${{ matrix.server.tts_mode == 'local' && secrets.STAGING_HF_TOKEN || '' }}
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          # Keep this false so our script can capture deploy.sh failures,
          # print the deploy log, then exit with the captured status.
          script_stop: false
          command_timeout: 20m
          envs: GHCR_OWNER,GHCR_READ_TOKEN,RUNTIME_CHAT_HISTORY_SIGNING_SECRET,RUNTIME_MATRIX_NOTES_ACCESS_SECRET,RUNTIME_HF_TOKEN
          script: |
            set -euo pipefail

            SHA="${{ github.sha }}"
            SITE="${{ env.STAGING_SITE }}"
            EXPECTED_DOMAIN="${{ env.STAGING_DOMAIN }}"
            EXPECTED_PORT="${{ env.STAGING_PORT }}"
            TTS_MODE="${{ matrix.server.tts_mode }}"
            DEPLOY_MODE="${{ env.DEPLOY_MODE }}"
            TARBALL="/tmp/portfolio-${SHA}.tar.gz"
            STAGING="/tmp/portfolio-stage-${SHA}"
            DEPLOY_KIT="/tmp/portfolio-deploy-kit-${SHA}.tar.gz"
            DEPLOY_CMD_LOG="/tmp/${SITE}-deploy-command-${SHA}.log"
            IMAGE_REF="${{ needs.build.outputs.image_ref }}"
            DOCKER_CONFIG_DIR=""
            RUNTIME_ENV_TEMP=""
            RUNTIME_ENV_REMOTE_TEMP=""

            DEPLOY_OK=0
            cleanup_staging() {
              local exit_code=$?
              trap - EXIT
              set +e
              sudo rm -rf "$STAGING" 2>/dev/null || true
              if [ -n "$DOCKER_CONFIG_DIR" ]; then
                sudo rm -rf "$DOCKER_CONFIG_DIR" 2>/dev/null || true
              fi
              if [ -n "$RUNTIME_ENV_TEMP" ]; then
                rm -f "$RUNTIME_ENV_TEMP" 2>/dev/null || true
              fi
              if [ -n "$RUNTIME_ENV_REMOTE_TEMP" ]; then
                sudo rm -f "$RUNTIME_ENV_REMOTE_TEMP" 2>/dev/null || true
              fi
              if [ "$DEPLOY_OK" = "1" ]; then
                sudo rm -f "$TARBALL" 2>/dev/null || true
                sudo rm -f "$DEPLOY_KIT" 2>/dev/null || true
              fi
              exit "$exit_code"
            }
            trap cleanup_staging EXIT

            echo "Deploying ${DEPLOY_MODE} staging to ${{ matrix.server.name }}"
            echo "SHA:  ${SHA}"
            echo "Site: ${SITE}"
            if [ "$DEPLOY_MODE" = "image" ]; then
              echo "Image: ${IMAGE_REF}"
            fi

            if [ "$SITE" != "portfolio-staging" ] || [ "$EXPECTED_PORT" != "3010" ] || [ "$EXPECTED_DOMAIN" != "staging.whoisdhruv.com" ]; then
              echo "Refusing unsafe staging deploy identity: site=${SITE}, domain=${EXPECTED_DOMAIN}, port=${EXPECTED_PORT}"
              exit 1
            fi

            sync_runtime_secrets() {
              local env_file="/opt/${SITE}/config/.env.local"
              local env_uid
              local env_gid

              if [[ ! "${RUNTIME_CHAT_HISTORY_SIGNING_SECRET:-}" =~ ^[[:xdigit:]]{64}$ ]]; then
                echo "Staging chat-history signing secret is missing or malformed"
                exit 1
              fi
              if [[ ! "${RUNTIME_MATRIX_NOTES_ACCESS_SECRET:-}" =~ ^[[:xdigit:]]{64}$ ]]; then
                echo "Staging Matrix Notes access secret is missing or malformed"
                exit 1
              fi
              if [ "$TTS_MODE" = "local" ] && [ -z "${RUNTIME_HF_TOKEN:-}" ]; then
                echo "Staging Hugging Face runtime token is missing"
                exit 1
              fi
              if ! sudo test -f "$env_file"; then
                echo "Staging runtime env file is missing: $env_file"
                exit 1
              fi

              RUNTIME_ENV_TEMP="$(mktemp)"
              sudo awk -F= '$1 != "CHAT_HISTORY_SIGNING_SECRET" && $1 != "MATRIX_NOTES_ACCESS_SECRET" && $1 != "TTS_NODE_MODE" && $1 != "HF_TOKEN" && $1 != "HF_HOME" && $1 != "HF_HUB_CACHE" && $1 !~ /^LOCAL_TTS_/' \
                "$env_file" > "$RUNTIME_ENV_TEMP"
              printf 'CHAT_HISTORY_SIGNING_SECRET=%s\n' "$RUNTIME_CHAT_HISTORY_SIGNING_SECRET" >> "$RUNTIME_ENV_TEMP"
              printf 'MATRIX_NOTES_ACCESS_SECRET=%s\n' "$RUNTIME_MATRIX_NOTES_ACCESS_SECRET" >> "$RUNTIME_ENV_TEMP"
              printf 'TTS_NODE_MODE=%s\n' "$TTS_MODE" >> "$RUNTIME_ENV_TEMP"
              if [ "$TTS_MODE" = "local" ]; then
                printf 'HF_TOKEN=%s\n' "$RUNTIME_HF_TOKEN" >> "$RUNTIME_ENV_TEMP"
                printf 'HF_HUB_CACHE=/var/cache/%s/pocket-tts\n' "$SITE" >> "$RUNTIME_ENV_TEMP"
                printf 'LOCAL_TTS_CACHE_DIR=/var/cache/%s/pocket-tts\n' "$SITE" >> "$RUNTIME_ENV_TEMP"
                printf 'LOCAL_TTS_VOICE_STATE_PATH=/var/cache/%s/pocket-tts/custom-dhruv.safetensors\n' "$SITE" >> "$RUNTIME_ENV_TEMP"
              fi

              env_uid="$(sudo stat -c '%u' "$env_file")"
              env_gid="$(sudo stat -c '%g' "$env_file")"
              RUNTIME_ENV_REMOTE_TEMP="${env_file}.next.${SHA}.$$"
              sudo install -m 600 -o "$env_uid" -g "$env_gid" "$RUNTIME_ENV_TEMP" "$RUNTIME_ENV_REMOTE_TEMP"
              sudo mv -f "$RUNTIME_ENV_REMOTE_TEMP" "$env_file"
              RUNTIME_ENV_REMOTE_TEMP=""
              rm -f "$RUNTIME_ENV_TEMP"
              RUNTIME_ENV_TEMP=""
              echo "Synchronized staging runtime secrets for TTS role $TTS_MODE"
            }

            sync_runtime_secrets

            if [ "$TTS_MODE" = "remote" ]; then
              backend_url="$(sudo awk -F= '$1 == "TTS_BACKEND_URL" { value=$2; gsub(/^[ \t\"]+|[ \t\"]+$/, "", value); print value; exit }' "/etc/deploy/sites/${SITE}.conf")"
              tts_token="$(sudo awk -F= '$1 == "TTS_BACKEND_TOKEN" { value=$2; gsub(/^[ \t\"]+|[ \t\"]+$/, "", value); print value; exit }' "/etc/deploy/sites/${SITE}.conf")"
              backend_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -H "X-Portfolio-TTS-Token: $tts_token" -H "Origin: https://${EXPECTED_DOMAIN}" "${backend_url}/api/tts" 2>/dev/null || echo 000)"
              [ "$backend_code" = "200" ] || { echo "Remote Pocket TTS gateway is not reachable after staging-1 deployment (HTTP $backend_code)"; exit 1; }
            fi

            if [ "$DEPLOY_MODE" = "image" ]; then
              echo "Checking deploy kit at $DEPLOY_KIT"
              if [ ! -f "$DEPLOY_KIT" ]; then
                echo "Deploy kit missing at $DEPLOY_KIT"
                exit 1
              fi
              if [ "${IMAGE_REF#*@sha256:}" = "$IMAGE_REF" ]; then
                echo "Image digest missing from build job: $IMAGE_REF"
                exit 1
              fi

              echo "Extracting deploy kit to $STAGING"
              sudo rm -rf "$STAGING" || { echo "failed to remove old staging dir"; exit 1; }
              sudo mkdir -p "$STAGING" || { echo "failed to create staging dir"; exit 1; }
              sudo tar xzf "$DEPLOY_KIT" -C "$STAGING" || { echo "failed to extract deploy kit"; exit 1; }
              if [ ! -f "$STAGING/deploy.sh" ]; then
                echo "deploy.sh missing - deploy kit corrupt"
                exit 1
              fi
              if [ ! -f "$STAGING/nginx-cloudflare.conf" ]; then
                echo "nginx template missing - deploy kit corrupt"
                exit 1
              fi
              if [ ! -f "$STAGING/portfolio.conf.example" ]; then
                echo "config examples missing - deploy kit corrupt"
                exit 1
              fi
              sudo chmod +x "$STAGING/deploy.sh"

              DOCKER_CONFIG_DIR="$(mktemp -d)"
              sudo chmod 700 "$DOCKER_CONFIG_DIR"

              if [ -n "${GHCR_READ_TOKEN:-}" ]; then
                echo "Logging in to GHCR"
                printf '%s' "$GHCR_READ_TOKEN" | sudo env DOCKER_CONFIG="$DOCKER_CONFIG_DIR" docker login ghcr.io \
                  -u "$GHCR_OWNER" --password-stdin || { echo "GHCR login failed"; exit 1; }
              fi

              echo "Invoking image deploy script"
              deploy_status=0
              sudo env DOCKER_CONFIG="$DOCKER_CONFIG_DIR" bash "$STAGING/deploy.sh" --image "$IMAGE_REF" --sha "$SHA" --site "$SITE" > "$DEPLOY_CMD_LOG" 2>&1 || deploy_status=$?
              cat "$DEPLOY_CMD_LOG" || true
              if [ "$deploy_status" -ne 0 ]; then
                echo "deploy.sh image mode failed with status $deploy_status"
                latest_log=$(sudo find "/var/log/${SITE}-deploy" -name 'deploy-*.log' -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)
                if [ -n "$latest_log" ]; then
                  echo "Latest deploy log: $latest_log"
                  sudo tail -n 160 "$latest_log" || true
                else
                  echo "No deploy log found under /var/log/${SITE}-deploy"
                fi
                exit "$deploy_status"
              fi
            else
              echo "Checking artifact tarball at $TARBALL"
              if [ ! -f "$TARBALL" ]; then
                echo "Tarball missing at $TARBALL"
                exit 1
              fi
              echo "Extracting artifact to $STAGING"
              sudo rm -rf "$STAGING" || { echo "failed to remove old staging dir"; exit 1; }
              sudo mkdir -p "$STAGING" || { echo "failed to create staging dir"; exit 1; }
              sudo tar xzf "$TARBALL" -C "$STAGING" || { echo "failed to extract artifact"; exit 1; }
              if [ ! -f "$STAGING/server.js" ]; then
                echo "server.js missing - artifact corrupt"
                exit 1
              fi
              if [ ! -f "$STAGING/.deploy/deploy.sh" ]; then
                echo ".deploy/deploy.sh missing - artifact corrupt"
                exit 1
              fi
              sudo chmod +x "$STAGING/.deploy/deploy.sh"

              echo "Invoking artifact deploy script"
              deploy_status=0
              sudo bash "$STAGING/.deploy/deploy.sh" --release-dir "$STAGING" --sha "$SHA" --site "$SITE" > "$DEPLOY_CMD_LOG" 2>&1 || deploy_status=$?
              cat "$DEPLOY_CMD_LOG" || true
              if [ "$deploy_status" -ne 0 ]; then
                echo "deploy.sh artifact mode failed with status $deploy_status"
                latest_log=$(sudo find "/var/log/${SITE}-deploy" -name 'deploy-*.log' -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)
                if [ -n "$latest_log" ]; then
                  echo "Latest deploy log: $latest_log"
                  sudo tail -n 160 "$latest_log" || true
                else
                  echo "No deploy log found under /var/log/${SITE}-deploy"
                fi
                exit "$deploy_status"
              fi
            fi

            DEPLOY_OK=1
            echo "Staging deployment completed on ${{ matrix.server.name }}"
            exit 0

      - name: Verify staging deployment (${{ matrix.server.name }})
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          command_timeout: 6m
          script: |
            set -euo pipefail

            SITE="${{ env.STAGING_SITE }}"
            EXPECTED_DOMAIN="${{ env.STAGING_DOMAIN }}"
            EXPECTED_PORT="${{ env.STAGING_PORT }}"
            SITE_CONF="/etc/deploy/sites/${SITE}.conf"
            META_FILE="/opt/${SITE}/current/.deploy/meta.json"

            fail() {
              echo "ERROR: $*" >&2
              exit 1
            }

            read_conf() {
              local key="$1"
              sudo awk -F= -v k="$key" '$1 == k { value=$2; gsub(/^[ \t\"]+|[ \t\"]+$/, "", value); print value; exit }' "$SITE_CONF"
            }

            sudo test -f "$SITE_CONF" || fail "missing staging site config: $SITE_CONF"

            SVC_NAME="$(read_conf SERVICE_NAME)"
            SVC_PORT="$(read_conf NEXTJS_PORT)"
            SVC_DOMAIN="$(read_conf DOMAIN)"
            SVC_TTS_MODE="$(read_conf TTS_NODE_MODE)"

            [ "$SVC_NAME" = "$SITE" ] || fail "SERVICE_NAME must be $SITE, got ${SVC_NAME:-unset}"
            [ "$SVC_PORT" = "$EXPECTED_PORT" ] || fail "NEXTJS_PORT must be $EXPECTED_PORT, got ${SVC_PORT:-unset}"
            [ "$SVC_DOMAIN" = "$EXPECTED_DOMAIN" ] || fail "DOMAIN must be $EXPECTED_DOMAIN, got ${SVC_DOMAIN:-unset}"
            [ "$SVC_TTS_MODE" = "${{ matrix.server.tts_mode }}" ] || fail "TTS_NODE_MODE must be ${{ matrix.server.tts_mode }}, got ${SVC_TTS_MODE:-unset}"

            if ! sudo systemctl is-active --quiet "$SVC_NAME"; then
              echo "${SVC_NAME}.service is NOT running"
              sudo journalctl -u "$SVC_NAME" --no-pager -n 20
              exit 1
            fi

            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 5 \
              "http://127.0.0.1:${SVC_PORT}/" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Staging returned HTTP $HTTP_CODE on :$SVC_PORT"
              exit 1
            fi

            HTML_FILE="$(mktemp)"
            ASSET_FILE="$(mktemp)"
            TTS_STREAM_FILE="$(mktemp)"
            trap 'rm -f "$HTML_FILE" "$ASSET_FILE" "$TTS_STREAM_FILE"' EXIT
            TTS_HTTP_CODE=$(curl -sk --max-time 300 --resolve "${SVC_DOMAIN}:443:127.0.0.1" \
              -X POST -H "Accept: application/x-ndjson" -H "Content-Type: application/json" \
              -H "Origin: https://${SVC_DOMAIN}" -H "Sec-Fetch-Site: same-origin" \
              --data '{"text":"Staging topology verification.","stream":true}' \
              -o "$TTS_STREAM_FILE" -w "%{http_code}" "https://${SVC_DOMAIN}/api/tts" 2>/dev/null || echo "000")
            [ "$TTS_HTTP_CODE" = "200" ] || fail "Pocket TTS HTTPS route returned HTTP $TTS_HTTP_CODE"
            grep -q '"type":"ready"' "$TTS_STREAM_FILE" && grep -q '"type":"chunk"' "$TTS_STREAM_FILE" && grep -q '"type":"done"' "$TTS_STREAM_FILE" \
              || fail "Pocket TTS HTTPS stream was incomplete"
            echo "Pocket TTS HTTPS topology verified"

            curl -sk --max-time 10 --resolve "${SVC_DOMAIN}:443:127.0.0.1" \
              "https://${SVC_DOMAIN}/?asset_probe=${{ github.sha }}" > "$HTML_FILE"
            grep -oE "/_next/static/[^\"' <)]*" "$HTML_FILE" \
              | sed 's/[\\?].*$//' \
              | sort -u > "$ASSET_FILE" || true

            ASSET_COUNT="$(wc -l < "$ASSET_FILE" | tr -d ' ')"
            if [ "$ASSET_COUNT" = "0" ]; then
              echo "No /_next/static assets found in local nginx HTML"
              exit 1
            fi

            missing_assets=0
            diagnosed_missing=0
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              asset_code="$(curl -sk -o /dev/null -w "%{http_code}" --max-time 5 \
                --resolve "${SVC_DOMAIN}:443:127.0.0.1" "https://${SVC_DOMAIN}${asset}" 2>/dev/null || echo "000")"
              if [ "$asset_code" != "200" ]; then
                echo "Static asset failed through local nginx: $asset -> $asset_code"
                if [ "$diagnosed_missing" = "0" ]; then
                  relative_asset="${asset#/_next/static/}"
                  expected_file="/opt/${SITE}/current/.next/static/${relative_asset}"
                  if sudo test -f "$expected_file"; then
                    echo "Asset exists on disk but nginx did not serve it: $expected_file"
                    sudo stat -c 'mode=%a owner=%U group=%G path=%n' "$expected_file" || true
                    sudo namei -l "$expected_file" || true
                  else
                    echo "Asset missing on disk: $expected_file"
                    echo "Sample files under /opt/${SITE}/current/.next/static:"
                    sudo find "/opt/${SITE}/current/.next/static" -maxdepth 3 -type f | sort | head -40 || true
                  fi
                  diagnosed_missing=1
                fi
                missing_assets=1
              fi
            done < "$ASSET_FILE"
            if [ "$missing_assets" != "0" ]; then
              exit 1
            fi
            echo "Verified $ASSET_COUNT local nginx static assets for $SVC_NAME"

            if [ "${{ env.DEPLOY_MODE }}" = "image" ]; then
              if ! sudo docker ps --format '{{.Names}}' | grep -qx "$SVC_NAME"; then
                echo "Docker container is not running: $SVC_NAME"
                sudo docker ps -a --filter "name=^/${SVC_NAME}$"
                exit 1
              fi
            fi

            sudo test -f "$META_FILE" || fail "missing deploy metadata: $META_FILE"
            if ! sudo grep -q '"sha": "${{ github.sha }}"' "$META_FILE"; then
              echo "Deploy metadata does not match this workflow SHA (${{ github.sha }}):"
              sudo cat "$META_FILE" || true
              exit 1
            fi

            echo "Staging verified on ${{ matrix.server.name }}: $SVC_NAME on :$SVC_PORT"

      - name: Staging deployment success (${{ matrix.server.name }})
        if: success()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ${{ matrix.server.name }}: staging success" >> $GITHUB_STEP_SUMMARY

  smoke-staging:
    name: Smoke staging through Cloudflare
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Smoke staging URL
        run: |
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          asset_file=""
          trap 'rm -f "$headers_file" "$body_file" ${asset_file:+"$asset_file"}' EXIT

          status="$(curl -sS -L --retry 3 --retry-delay 2 --max-time 15 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Cache-Control: no-cache" \
            -D "$headers_file" \
            -o "$body_file" \
            -w "%{http_code}" \
            "https://${{ env.STAGING_DOMAIN }}/" || echo "000")"

          echo "Staging smoke HTTP status: $status"
          echo "Response headers:"
          grep -Ei '^(HTTP/|server:|cf-ray:|cf-cache-status:|cf-mitigated:|location:|content-type:|cache-control:)' "$headers_file" || true

          challenge=false
          if grep -qiE '^cf-mitigated:[[:space:]]*challenge' "$headers_file" \
            || grep -qi '<title>Just a moment' "$body_file" \
            || grep -qi 'challenges.cloudflare.com' "$body_file"; then
            challenge=true
          fi

          if [ "$status" != "200" ]; then
            if [ "$status" = "403" ] && [ "$challenge" = "true" ]; then
              echo "::warning::Cloudflare returned a bot challenge to the GitHub runner. Skipping homepage asset assertions, but continuing to the required chat smoke probe."
              challenge=true
            else
              echo "Response body preview:"
              head -c 1600 "$body_file" || true
              echo ""
              echo "::error::staging.whoisdhruv.com returned HTTP $status"
              exit 1
            fi
          fi

          if [ "$challenge" != "true" ]; then
            asset_file="$(mktemp)"
            grep -oE "/_next/static/[^\"' <)]*" "$body_file" \
              | sed 's/[\\?].*$//' \
              | sort -u > "$asset_file" || true

            asset_count="$(wc -l < "$asset_file" | tr -d ' ')"
            if [ "$asset_count" = "0" ]; then
              echo "::error::No /_next/static assets found in staging HTML"
              exit 1
            fi

            missing_assets=0
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              asset_status="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
                -H "Cache-Control: no-cache" \
                "https://${{ env.STAGING_DOMAIN }}${asset}" 2>/dev/null || echo "000")"
              if [ "$asset_status" != "200" ]; then
                echo "Static asset failed through Cloudflare: $asset -> $asset_status"
                missing_assets=1
              fi
            done < "$asset_file"
            if [ "$missing_assets" != "0" ]; then
              echo "::error::One or more staging static assets returned non-200"
              exit 1
            fi
          fi

          chat_headers_file="$(mktemp)"
          chat_body_file="$(mktemp)"
          trap 'rm -f "$headers_file" "$body_file" ${asset_file:+"$asset_file"} "$chat_headers_file" "$chat_body_file"' EXIT
          chat_status="$(curl -sS -L --retry 3 --retry-delay 2 --max-time 15 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125 Safari/537.36" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Origin: https://${{ env.STAGING_DOMAIN }}" \
            -H "Referer: https://${{ env.STAGING_DOMAIN }}/" \
            -H "Sec-Fetch-Site: same-origin" \
            -H "Cache-Control: no-cache" \
            -X POST \
            --data '{"messages":[{"role":"user","content":"go to the about page"}]}' \
            -D "$chat_headers_file" \
            -o "$chat_body_file" \
            -w "%{http_code}" \
            "https://${{ env.STAGING_DOMAIN }}/chat/respond" || echo "000")"

          echo "Staging chat smoke HTTP status: $chat_status"
          echo "Chat response headers:"
          grep -Ei '^(HTTP/|server:|cf-ray:|cf-cache-status:|cf-mitigated:|content-type:)' "$chat_headers_file" || true

          if grep -qiE '^cf-mitigated:[[:space:]]*challenge' "$chat_headers_file" \
            || grep -qi '<title>Just a moment' "$chat_body_file" \
            || grep -qi 'challenges.cloudflare.com' "$chat_body_file"; then
            echo "::warning::Cloudflare challenged the GitHub runner's staging chat probe after all VM-local checks passed. Skipping edge chat assertions."
            echo "Staging origins passed; Cloudflare challenged the GitHub runner, so edge chat assertions were skipped." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$chat_status" != "200" ]; then
            echo "Chat response body preview:"
            head -c 1600 "$chat_body_file" || true
            echo ""
            echo "::error::staging chat returned HTTP $chat_status"
            exit 1
          fi
          if ! grep -qiE '^content-type:[[:space:]]*application/json([;[:space:]]|$)' "$chat_headers_file"; then
            echo "::error::staging chat returned a non-JSON response"
            exit 1
          fi
          if ! node - "$chat_body_file" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));

          if (body?.action?.navigateTo !== '/about') {
            throw new Error('Chat response did not include a navigateTo action for /about');
          }
          NODE
          then
            echo "::error::staging chat response did not contain the expected navigateTo /about action"
            exit 1
          fi

          echo "Staging Cloudflare URL responded: https://${{ env.STAGING_DOMAIN }}" >> $GITHUB_STEP_SUMMARY
