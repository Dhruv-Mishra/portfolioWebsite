name: Deploy Portfolio

permissions:
  contents: read
  packages: write

# ─────────────────────────────────────────────────────────────────────────────
# Architecture: build-once-deploy-many
#
#   build job (ubuntu-latest, once)
#     └── npm ci → lint → test → next build → assemble standalone →
#         tar czf portfolio-<sha>.tar.gz with deploy.sh bundled inside →
#         build/push ghcr.io image tagged by the same SHA
#
#   deploy-staging job (manual GitHub Environment gate, needs: build)
#     └── deploy the exact image/artifact build to staging/dogfood first
#
#   approve-production job (manual GitHub Environment gate, needs: staging)
#     └── waits for human approval after staging has been tested
#
#   deploy-production job (matrix, serial VMs, needs: approve-production)
#     └── promotes the exact same immutable image digest/artifact to production
#
# Why bundle deploy.sh inside the artifact:
#   - Single-commit self-bootstrapping: the first push with this new workflow
#     ships the new deploy.sh alongside the build. The VM extracts it from the
#     tarball and runs it. No "update deploy.sh from git first" dance needed.
#   - Hermetic reproducibility: deploy.sh version is always locked to bundle
#     version. Impossible for them to drift.
#
# Why multi-platform image publishing:
#   - The Next.js standalone bundle is still pure JavaScript at runtime, but
#     the container now includes Python/eSpeak for local TTS.
#   - Buildx publishes linux/amd64 and linux/arm64 variants so fresh VMs can
#     pull the same immutable digest regardless of CPU architecture.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Production site config name (matches /etc/deploy/sites/<name>.conf)'
        required: false
        default: portfolio
        type: string
      staging_site:
        description: 'Staging site config name (matches /etc/deploy/sites/<name>.conf)'
        required: false
        default: portfolio-staging
        type: string
      skip_nginx:
        description: 'Skip nginx config update & reload'
        required: false
        default: false
        type: boolean
      deploy_mode:
        description: 'Deployment mode'
        required: false
        default: image
        type: choice
        options:
          - image
          - artifact

  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.github/dependabot.yml'
      - '.github/agents/**'
      - '.github/instructions/**'
      - 'LICENSE'
      - 'ResumeBuilder/**'

concurrency:
  group: deploy-${{ inputs.site || 'portfolio' }}
  cancel-in-progress: false

env:
  DOMAIN: whoisdhruv.com
  STAGING_DOMAIN: staging.whoisdhruv.com
  NODE_VERSION: '22'
  CI_NPM_VERSION: '10.9.8'
  DEPLOY_MODE: ${{ inputs.deploy_mode || 'image' }}
  NEXT_PUBLIC_GA_ID: ''
  NEXT_PUBLIC_ENABLE_ANALYTICS: 'false'
  NEXT_PUBLIC_ENABLE_ERROR_TRACKING: 'false'
  # Suppress the anonymous telemetry banner from Next.js builds; we don't act
  # on it and it pollutes CI logs.
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # BUILD — runs once on ubuntu-latest, produces a single artifact
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build artifact and image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image-meta.outputs.image }}
      image_digest: ${{ steps.docker-build.outputs.digest }}
      image_ref: ${{ steps.image-meta.outputs.image }}@${{ steps.docker-build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: portfolio/package-lock.json

      # Restore Turbopack/webpack incremental cache. Hashes lockfile + source
      # so a dependency change or any code change misses, but pure CI re-runs
      # of the same commit (e.g. retry after flaky deploy) hit warm and shave
      # ~30-50% off the Next.js compile step.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: portfolio/.next/cache
          key: nextjs-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('portfolio/package-lock.json') }}-${{ hashFiles('portfolio/**/*.[jt]s', 'portfolio/**/*.[jt]sx', 'portfolio/**/*.css', 'portfolio/next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('portfolio/package-lock.json') }}-
            nextjs-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies
        working-directory: portfolio
        # SKIP_EMBEDDINGS_BUILD=1 tells the prebuild hook to reuse the committed
        # lib/facts.embeddings.json rather than hitting the embeddings API.
        # Avoids needing LLM_API_KEY as an Actions secret.
        env:
          SKIP_EMBEDDINGS_BUILD: '1'
        # Two-stage install: a fast dry-run first to surface lockfile drift
        # with a clear, actionable error before paying the full install cost.
        # The pre-commit hook in .githooks/ should prevent this from firing,
        # but this guard catches bypasses (--no-verify), Dependabot edge cases,
        # and any future drift introduced outside the hook's scope.
        run: |
          npm_cmd=(npx -y npm@${{ env.CI_NPM_VERSION }})

          if ! "${npm_cmd[@]}" ci --dry-run >/dev/null 2>&1; then
            echo "::error::Lockfile out of sync with package.json. Regenerate locally with: cd portfolio && npx -y npm@${{ env.CI_NPM_VERSION }} install --package-lock-only --include=optional"
            "${npm_cmd[@]}" ci --dry-run
            exit 1
          fi
          "${npm_cmd[@]}" ci

      - name: Lint
        working-directory: portfolio
        run: npm run lint

      - name: Test
        working-directory: portfolio
        run: npm test

      - name: Build Next.js (standalone)
        working-directory: portfolio
        env:
          SKIP_EMBEDDINGS_BUILD: '1'
          NEXT_BUILD_ID: ${{ github.sha }}
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build

      - name: Assemble standalone bundle
        working-directory: portfolio
        run: |
          set -euo pipefail

          # Next.js standalone omits static/ and public/ — copy them in
          cp -r .next/static .next/standalone/.next/
          cp -r public        .next/standalone/

          # Ship deploy.sh + nginx template INSIDE the artifact at .deploy/
          # so the VM can invoke it directly without a separate git pull.
          mkdir -p .next/standalone/.deploy
          cp scripts/deploy.sh          .next/standalone/.deploy/
          cp nginx-cloudflare.conf      .next/standalone/.deploy/
          chmod +x .next/standalone/.deploy/deploy.sh

          # Build metadata — useful for forensics if a deploy goes sideways
          cat > .next/standalone/.deploy/meta.json <<META
          {
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "actor": "${{ github.actor }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}"
          }
          META

          # Package. Contents extract to the root of whatever dir you untar into.
          tar czf ../portfolio-${{ github.sha }}.tar.gz -C .next/standalone .

          ls -lh ../portfolio-${{ github.sha }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-bundle
          path: portfolio-${{ github.sha }}.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Resolve image name
        id: image-meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: env.DEPLOY_MODE == 'image'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.DEPLOY_MODE == 'image'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: env.DEPLOY_MODE == 'image'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: env.DEPLOY_MODE == 'image'
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: portfolio
          file: portfolio/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image-meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_BUILD_ID=${{ github.sha }}
            NEXT_PUBLIC_GA_ID=${{ env.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_SITE_URL=https://${{ env.DOMAIN }}
            NEXT_PUBLIC_ENABLE_ANALYTICS=${{ env.NEXT_PUBLIC_ENABLE_ANALYTICS }}
            NEXT_PUBLIC_ENABLE_ERROR_TRACKING=${{ env.NEXT_PUBLIC_ENABLE_ERROR_TRACKING }}
            NEXT_PUBLIC_TTS_VOICE=expr-voice-5-m
            NEXT_PUBLIC_TTS_SPEED=1

      - name: Build summary
        run: |
          SIZE=$(ls -l portfolio-${{ github.sha }}.tar.gz | awk '{print $5}')
          SIZE_MB=$(( SIZE / 1024 / 1024 ))
          echo "## 📦 Build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | portfolio-${{ github.sha }}.tar.gz |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.DEPLOY_MODE }}" = "image" ]; then
            echo "| Image | ${{ steps.image-meta.outputs.image }}@${{ steps.docker-build.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Image | skipped (artifact deploy mode) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Size | ${SIZE_MB} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Node | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY

  # ───────────────────────────────────────────────────────────────────────────
  # STAGING — manual gate, deploys the exact build before production promotion
  # ───────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        server:
          - name: staging
            host_secret: STAGING_SERVER_HOST
            user_secret: STAGING_SERVER_USERNAME
            key_secret: STAGING_SERVER_SSH_KEY
            port_secret: STAGING_SERVER_PORT
            ghcr_secret: GHCR_READ_TOKEN

    environment:
      name: ${{ matrix.server.name }}
      url: https://${{ env.STAGING_DOMAIN }}

    steps:
      - name: Staging deployment started
        run: |
          echo "## 🧪 Staging deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | staging |" >> $GITHUB_STEP_SUMMARY
          echo "| Site | ${{ inputs.staging_site || 'portfolio-staging' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://${{ env.STAGING_DOMAIN }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | ${{ env.DEPLOY_MODE }} |" >> $GITHUB_STEP_SUMMARY

      - name: Validate staging SSH secrets
        run: |
          missing=0
          if [ -z "${{ secrets[matrix.server.host_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.host_secret }} not configured for staging"
            missing=1
          fi
          if [ -z "${{ secrets[matrix.server.user_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.user_secret }} not configured for staging"
            missing=1
          fi
          if [ -z "${{ secrets[matrix.server.key_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.key_secret }} not configured for staging"
            missing=1
          fi
          if [ -z "${{ secrets[matrix.server.port_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.port_secret }} not configured for staging"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            exit 1
          fi

      - name: Download build artifact
        if: env.DEPLOY_MODE == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: portfolio-bundle

      - name: Copy artifact to staging VM
        if: env.DEPLOY_MODE == 'artifact'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          source: portfolio-${{ github.sha }}.tar.gz
          target: /tmp/
          timeout: 60s
          command_timeout: 3m

      - name: Checkout deploy kit
        if: env.DEPLOY_MODE == 'image'
        uses: actions/checkout@v4

      - name: Package deploy kit
        if: env.DEPLOY_MODE == 'image'
        run: |
          set -euo pipefail
          mkdir -p deploy-kit
          cp portfolio/scripts/deploy.sh deploy-kit/deploy.sh
          cp portfolio/nginx-cloudflare.conf deploy-kit/nginx-cloudflare.conf
          cp portfolio/scripts/machine.conf.example deploy-kit/machine.conf.example
          cp portfolio/scripts/portfolio.conf.example deploy-kit/portfolio.conf.example
          tar czf portfolio-deploy-kit-${{ github.sha }}.tar.gz -C deploy-kit .

      - name: Copy deploy kit to staging VM
        if: env.DEPLOY_MODE == 'image'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          source: portfolio-deploy-kit-${{ github.sha }}.tar.gz
          target: /tmp/
          timeout: 60s
          command_timeout: 3m

      - name: Deploy on staging
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets[matrix.server.ghcr_secret] }}
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          script_stop: true
          command_timeout: 20m
          envs: GHCR_OWNER,GHCR_READ_TOKEN
          script: |
            set -euo pipefail

            SHA="${{ github.sha }}"
            SITE="${{ inputs.staging_site || 'portfolio-staging' }}"
            DEPLOY_MODE="${{ env.DEPLOY_MODE }}"
            TARBALL="/tmp/portfolio-${SHA}.tar.gz"
            STAGING="/tmp/portfolio-stage-${SHA}"
            DEPLOY_KIT="/tmp/portfolio-deploy-kit-${SHA}.tar.gz"
            IMAGE_REF="${{ needs.build.outputs.image_ref }}"

            DEPLOY_OK=0
            cleanup_staging() {
              sudo rm -rf "$STAGING" 2>/dev/null || true
              if [ "$DEPLOY_OK" = "1" ]; then
                sudo rm -f "$TARBALL" 2>/dev/null || true
                sudo rm -f "$DEPLOY_KIT" 2>/dev/null || true
              fi
            }
            trap cleanup_staging EXIT

            echo "🚀 ${DEPLOY_MODE} deploy to staging"
            echo "   SHA:  ${SHA}"
            echo "   Site: ${SITE}"
            if [ "$DEPLOY_MODE" = "image" ]; then
              echo "   Image: ${IMAGE_REF}"
            fi
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            EXTRA_FLAGS=""
            if [ "${{ inputs.skip_nginx || 'false' }}" = "true" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --skip-nginx"
            fi

            if [ "$DEPLOY_MODE" = "image" ]; then
              [ -f "$DEPLOY_KIT" ] || { echo "❌ Deploy kit missing at $DEPLOY_KIT"; exit 1; }
              case "$IMAGE_REF" in
                *@sha256:*) ;;
                *) echo "❌ Image digest missing from build job: $IMAGE_REF"; exit 1 ;;
              esac

              sudo rm -rf "$STAGING"
              sudo mkdir -p "$STAGING"
              sudo tar xzf "$DEPLOY_KIT" -C "$STAGING"
              [ -f "$STAGING/deploy.sh" ] || { echo "❌ deploy.sh missing — deploy kit corrupt"; exit 1; }
              [ -f "$STAGING/nginx-cloudflare.conf" ] || { echo "❌ nginx template missing — deploy kit corrupt"; exit 1; }
              [ -f "$STAGING/portfolio.conf.example" ] || { echo "❌ config examples missing — deploy kit corrupt"; exit 1; }
              sudo chmod +x "$STAGING/deploy.sh"

              if [ -n "${GHCR_READ_TOKEN:-}" ]; then
                printf '%s' "$GHCR_READ_TOKEN" | sudo docker login ghcr.io \
                  -u "$GHCR_OWNER" --password-stdin
              fi

              sudo bash "$STAGING/deploy.sh" \
                --image "$IMAGE_REF" \
                --sha "$SHA" \
                --site "$SITE" \
                $EXTRA_FLAGS
            else
              [ -f "$TARBALL" ] || { echo "❌ Tarball missing at $TARBALL"; exit 1; }
              sudo rm -rf "$STAGING"
              sudo mkdir -p "$STAGING"
              sudo tar xzf "$TARBALL" -C "$STAGING"
              [ -f "$STAGING/server.js" ] || { echo "❌ server.js missing — artifact corrupt"; exit 1; }
              [ -f "$STAGING/.deploy/deploy.sh" ] || { echo "❌ .deploy/deploy.sh missing — artifact corrupt"; exit 1; }
              sudo chmod +x "$STAGING/.deploy/deploy.sh"

              sudo bash "$STAGING/.deploy/deploy.sh" \
                --release-dir "$STAGING" \
                --sha "$SHA" \
                --site "$SITE" \
                $EXTRA_FLAGS
            fi

            DEPLOY_OK=1
            echo ""
            echo "✅ Staging deployment completed!"

      - name: Verify staging deployment
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          command_timeout: 2m
          script: |
            set -euo pipefail

            SITE="${{ inputs.staging_site || 'portfolio-staging' }}"
            SITE_CONF="/etc/deploy/sites/${SITE}.conf"

            SVC_NAME="$SITE"
            SVC_PORT="3001"
            if [ -f "$SITE_CONF" ]; then
              SVC_NAME=$(grep '^SERVICE_NAME=' "$SITE_CONF" | cut -d= -f2 | tr -d '"' || echo "$SITE")
              SVC_PORT=$(grep '^NEXTJS_PORT=' "$SITE_CONF"  | cut -d= -f2 | tr -d '"' || echo "3001")
            fi

            echo "🔍 Post-deploy verification for $SVC_NAME"
            if ! sudo systemctl is-active --quiet "$SVC_NAME"; then
              echo "❌ ${SVC_NAME}.service is NOT running"
              sudo journalctl -u "$SVC_NAME" --no-pager -n 20
              exit 1
            fi
            echo "✅ ${SVC_NAME}.service is running"

            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 5 \
              "http://127.0.0.1:${SVC_PORT}/" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ Staging returned HTTP $HTTP_CODE on :$SVC_PORT"
              exit 1
            fi
            echo "✅ Staging responding (HTTP $HTTP_CODE on :$SVC_PORT)"

            if [ "${{ env.DEPLOY_MODE }}" = "image" ]; then
              if ! sudo docker ps --format '{{.Names}}' | grep -qx "$SVC_NAME"; then
                echo "❌ Docker container is not running: $SVC_NAME"
                sudo docker ps -a --filter "name=^/${SVC_NAME}$"
                exit 1
              fi
              echo "✅ Docker container running: $SVC_NAME"
            fi

      - name: Smoke staging through Cloudflare
        if: success()
        run: |
          curl -fsS --retry 3 --retry-delay 2 --max-time 10 \
            "https://${{ env.STAGING_DOMAIN }}/" >/dev/null
          echo "✅ Staging Cloudflare URL responded" >> $GITHUB_STEP_SUMMARY

      - name: Staging deployment success
        if: success()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Staging: Success" >> $GITHUB_STEP_SUMMARY
          echo "🌐 [https://${{ env.STAGING_DOMAIN }}](https://${{ env.STAGING_DOMAIN }})" >> $GITHUB_STEP_SUMMARY

      - name: Staging deployment failed
        if: failure()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ❌ Staging: Failed" >> $GITHUB_STEP_SUMMARY
          echo "Production approval/deploy will not start until staging succeeds." >> $GITHUB_STEP_SUMMARY

  # ───────────────────────────────────────────────────────────────────────────
  # PRODUCTION APPROVAL — same workflow run, same immutable build
  # ───────────────────────────────────────────────────────────────────────────
  approve-production:
    name: Approve production promotion
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: production
      url: https://${{ env.DOMAIN }}

    steps:
      - name: Production promotion approved
        run: |
          echo "## ✅ Production promotion approved" >> $GITHUB_STEP_SUMMARY
          echo "Promoting the same build from staging to production." >> $GITHUB_STEP_SUMMARY
          echo "SHA: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.DEPLOY_MODE }}" = "image" ]; then
            echo "Image: ${{ needs.build.outputs.image_ref }}" >> $GITHUB_STEP_SUMMARY
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # PRODUCTION PREFLIGHT — validate all origins before any production mutation
  # ───────────────────────────────────────────────────────────────────────────
  preflight-production:
    name: Preflight ${{ matrix.server.name }}
    needs: approve-production
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      fail-fast: false
      matrix:
        server:
          - name: production-1
            host_secret: SERVER_HOST_1
            user_secret: SERVER_USERNAME_1
            key_secret: SERVER_SSH_KEY_1
            port_secret: SERVER_PORT_1
          - name: production-2
            host_secret: SERVER_HOST_2
            user_secret: SERVER_USERNAME_2
            key_secret: SERVER_SSH_KEY_2
            port_secret: SERVER_PORT_2
          - name: production-3
            host_secret: SERVER_HOST_3
            user_secret: SERVER_USERNAME_3
            key_secret: SERVER_SSH_KEY_3
            port_secret: SERVER_PORT_3

    environment:
      name: ${{ matrix.server.name }}

    steps:
      - name: Validate production SSH secrets
        run: |
          missing=0
          if [ -z "${{ secrets[matrix.server.host_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.host_secret }} not configured for ${{ matrix.server.name }}"
            missing=1
          fi
          if [ -z "${{ secrets[matrix.server.user_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.user_secret }} not configured for ${{ matrix.server.name }}"
            missing=1
          fi
          if [ -z "${{ secrets[matrix.server.key_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.key_secret }} not configured for ${{ matrix.server.name }}"
            missing=1
          fi
          if [ -z "${{ secrets[matrix.server.port_secret] }}" ]; then
            echo "::error::Secret ${{ matrix.server.port_secret }} not configured for ${{ matrix.server.name }}"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # DEPLOY — serial matrix across all VMs, consumes the build artifact/image
  # ───────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to ${{ matrix.server.name }}
    needs:
      - build
      - preflight-production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Activate one origin at a time. This keeps Cloudflare's origin set from
      # flipping all VMs at once, and stops queued origins if an earlier deploy
      # fails. If a later origin fails after an earlier one succeeded, rerun the
      # last known-good SHA or drain origins in Cloudflare before retrying.
      fail-fast: true
      max-parallel: 1
      matrix:
        server:
          - name: production-1
            host_secret: SERVER_HOST_1
            user_secret: SERVER_USERNAME_1
            key_secret: SERVER_SSH_KEY_1
            port_secret: SERVER_PORT_1
          - name: production-2
            host_secret: SERVER_HOST_2
            user_secret: SERVER_USERNAME_2
            key_secret: SERVER_SSH_KEY_2
            port_secret: SERVER_PORT_2
          - name: production-3
            host_secret: SERVER_HOST_3
            user_secret: SERVER_USERNAME_3
            key_secret: SERVER_SSH_KEY_3
            port_secret: SERVER_PORT_3

    environment:
      name: ${{ matrix.server.name }}
      url: https://${{ env.DOMAIN }}

    steps:
      - name: Deployment Started (${{ matrix.server.name }})
        run: |
          echo "## 🚀 Deployment — ${{ matrix.server.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Server | ${{ matrix.server.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Site | ${{ inputs.site || 'portfolio' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | ${{ env.DEPLOY_MODE }} |" >> $GITHUB_STEP_SUMMARY

      - name: Download build artifact
        if: env.DEPLOY_MODE == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: portfolio-bundle

      - name: Copy artifact to VM
        if: env.DEPLOY_MODE == 'artifact'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          source: portfolio-${{ github.sha }}.tar.gz
          target: /tmp/
          timeout: 60s
          command_timeout: 3m

      - name: Checkout deploy kit
        if: env.DEPLOY_MODE == 'image'
        uses: actions/checkout@v4

      - name: Package deploy kit
        if: env.DEPLOY_MODE == 'image'
        run: |
          set -euo pipefail
          mkdir -p deploy-kit
          cp portfolio/scripts/deploy.sh deploy-kit/deploy.sh
          cp portfolio/nginx-cloudflare.conf deploy-kit/nginx-cloudflare.conf
          cp portfolio/scripts/machine.conf.example deploy-kit/machine.conf.example
          cp portfolio/scripts/portfolio.conf.example deploy-kit/portfolio.conf.example
          tar czf portfolio-deploy-kit-${{ github.sha }}.tar.gz -C deploy-kit .

      - name: Copy deploy kit to VM
        if: env.DEPLOY_MODE == 'image'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          source: portfolio-deploy-kit-${{ github.sha }}.tar.gz
          target: /tmp/
          timeout: 60s
          command_timeout: 3m

      - name: Deploy on ${{ matrix.server.name }}
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          script_stop: true
          command_timeout: 20m
          envs: GHCR_OWNER,GHCR_READ_TOKEN
          script: |
            set -euo pipefail

            SHA="${{ github.sha }}"
            SITE="${{ inputs.site || 'portfolio' }}"
            DEPLOY_MODE="${{ env.DEPLOY_MODE }}"
            TARBALL="/tmp/portfolio-${SHA}.tar.gz"
            STAGING="/tmp/portfolio-stage-${SHA}"
            DEPLOY_KIT="/tmp/portfolio-deploy-kit-${SHA}.tar.gz"
            IMAGE_REF="${{ needs.build.outputs.image_ref }}"

            # Cleanup trap — always remove staging, and remove tarball on success.
            # (On failure, keep tarball at /tmp for forensics; it'll age out
            # naturally via tmp cleanup or be overwritten on retry.)
            DEPLOY_OK=0
            cleanup_staging() {
              sudo rm -rf "$STAGING" 2>/dev/null || true
              if [ "$DEPLOY_OK" = "1" ]; then
                sudo rm -f "$TARBALL" 2>/dev/null || true
                sudo rm -f "$DEPLOY_KIT" 2>/dev/null || true
              fi
            }
            trap cleanup_staging EXIT

            echo "🚀 ${DEPLOY_MODE} deploy to ${{ matrix.server.name }}"
            echo "   SHA:  ${SHA}"
            echo "   Site: ${SITE}"
            if [ "$DEPLOY_MODE" = "image" ]; then
              echo "   Image: ${IMAGE_REF}"
              if [ -z "${GHCR_READ_TOKEN:-}" ]; then
                echo "   GHCR: no GHCR_READ_TOKEN provided; docker pull must work with existing VM credentials or a public package"
              fi
            fi
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Optional pass-throughs. Currently only skip_nginx is exposed as
            # a workflow input — the other legacy flags (skip_git/deps/build,
            # force) are meaningless in artifact mode.
            EXTRA_FLAGS=""
            if [ "${{ inputs.skip_nginx || 'false' }}" = "true" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --skip-nginx"
            fi

            if [ "$DEPLOY_MODE" = "image" ]; then
              [ -f "$DEPLOY_KIT" ] || { echo "❌ Deploy kit missing at $DEPLOY_KIT"; exit 1; }
              case "$IMAGE_REF" in
                *@sha256:*) ;;
                *) echo "❌ Image digest missing from build job: $IMAGE_REF"; exit 1 ;;
              esac

              sudo rm -rf "$STAGING"
              sudo mkdir -p "$STAGING"
              sudo tar xzf "$DEPLOY_KIT" -C "$STAGING"
              [ -f "$STAGING/deploy.sh" ] || { echo "❌ deploy.sh missing — deploy kit corrupt"; exit 1; }
              [ -f "$STAGING/nginx-cloudflare.conf" ] || { echo "❌ nginx template missing — deploy kit corrupt"; exit 1; }
              [ -f "$STAGING/portfolio.conf.example" ] || { echo "❌ config examples missing — deploy kit corrupt"; exit 1; }
              sudo chmod +x "$STAGING/deploy.sh"

              if [ -n "${GHCR_READ_TOKEN:-}" ]; then
                printf '%s' "$GHCR_READ_TOKEN" | sudo docker login ghcr.io \
                  -u "$GHCR_OWNER" --password-stdin
              fi

              sudo bash "$STAGING/deploy.sh" \
                --image "$IMAGE_REF" \
                --sha "$SHA" \
                --site "$SITE" \
                $EXTRA_FLAGS
            else
              [ -f "$TARBALL" ] || { echo "❌ Tarball missing at $TARBALL"; exit 1; }

              # Extract into staging dir. Using rm -rf + mkdir -p covers the case
              # where a prior failed deploy left behind a half-extracted staging.
              sudo rm -rf "$STAGING"
              sudo mkdir -p "$STAGING"
              sudo tar xzf "$TARBALL" -C "$STAGING"

              # Sanity: must contain both the bundle and the deploy scripts.
              [ -f "$STAGING/server.js" ] || { echo "❌ server.js missing — artifact corrupt"; exit 1; }
              [ -f "$STAGING/.deploy/deploy.sh" ] || { echo "❌ .deploy/deploy.sh missing — artifact corrupt"; exit 1; }
              sudo chmod +x "$STAGING/.deploy/deploy.sh"

              # Invoke the deploy.sh that shipped with THIS build. The script
              # handles first-run bootstrap (creating /opt/portfolio/ if needed,
              # migrating .env.local from the legacy location, etc).
              sudo bash "$STAGING/.deploy/deploy.sh" \
                --release-dir "$STAGING" \
                --sha "$SHA" \
                --site "$SITE" \
                $EXTRA_FLAGS
            fi

            DEPLOY_OK=1
            echo ""
            echo "✅ ${{ matrix.server.name }}: Deployment completed!"

      - name: Verify Deployment (${{ matrix.server.name }})
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          command_timeout: 2m
          script: |
            set -euo pipefail

            SITE="${{ inputs.site || 'portfolio' }}"
            SITE_CONF="/etc/deploy/sites/${SITE}.conf"

            SVC_NAME="portfolio"
            SVC_PORT="3000"
            if [ -f "$SITE_CONF" ]; then
              SVC_NAME=$(grep '^SERVICE_NAME=' "$SITE_CONF" | cut -d= -f2 | tr -d '"' || echo "portfolio")
              SVC_PORT=$(grep '^NEXTJS_PORT=' "$SITE_CONF"  | cut -d= -f2 | tr -d '"' || echo "3000")
            fi

            echo "🔍 Post-deploy verification for $SVC_NAME"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # systemd health
            if sudo systemctl is-active --quiet "$SVC_NAME"; then
              echo "✅ ${SVC_NAME}.service is running"
            else
              echo "❌ ${SVC_NAME}.service is NOT running"
              sudo journalctl -u "$SVC_NAME" --no-pager -n 20
              exit 1
            fi

            # Next.js HTTP health
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 5 \
              "http://127.0.0.1:${SVC_PORT}/" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Next.js responding (HTTP $HTTP_CODE on :$SVC_PORT)"
            else
              echo "⚠️  Next.js returned HTTP $HTTP_CODE (expected 200)"
            fi

            # nginx health
            if sudo systemctl is-active --quiet nginx; then
              echo "✅ nginx is running"
            else
              echo "❌ nginx is NOT running"
              exit 1
            fi

            # Verify current release matches the deployed SHA
            DEPLOY_ROOT="/opt/${SVC_NAME}"
            if [ -L "$DEPLOY_ROOT/current" ]; then
              CURRENT_SHA=$(basename "$(readlink -f "$DEPLOY_ROOT/current")")
              if [ "$CURRENT_SHA" = "${{ github.sha }}" ]; then
                echo "✅ current → ${CURRENT_SHA:0:12} (matches deployed SHA)"
              else
                echo "⚠️  current → ${CURRENT_SHA} but deployed SHA is ${{ github.sha }}"
              fi
              RELEASE_COUNT=$(find "$DEPLOY_ROOT/releases" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
              echo "📦 Releases on disk: $RELEASE_COUNT"
            fi

            if [ "${{ env.DEPLOY_MODE }}" = "image" ]; then
              if sudo docker ps --format '{{.Names}}' | grep -qx "$SVC_NAME"; then
                RUNNING_IMAGE=$(sudo docker inspect --format '{{.Config.Image}}' "$SVC_NAME" 2>/dev/null || true)
                echo "✅ Docker container running: $SVC_NAME"
                echo "🐳 Image: $RUNNING_IMAGE"
              else
                echo "❌ Docker container is not running: $SVC_NAME"
                sudo docker ps -a --filter "name=^/${SVC_NAME}$"
                exit 1
              fi
            fi

            # Resource snapshot
            echo ""
            echo "📊 Disk:"
            df -h / | tail -1 | awk '{print "   Used: "$3" / "$2" ("$5" full)"}'
            echo "📊 Memory:"
            free -h | awk '/Mem:/{print  "   RAM:  "$3" used / "$2" total"}'
            free -h | awk '/Swap:/{print "   Swap: "$3" used / "$2" total"}'

      - name: Deployment Success (${{ matrix.server.name }})
        if: success()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ ${{ matrix.server.name }}: Success" >> $GITHUB_STEP_SUMMARY
          echo "🌐 [https://${{ env.DOMAIN }}](https://${{ env.DOMAIN }})" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed (${{ matrix.server.name }})
        if: failure()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ❌ ${{ matrix.server.name }}: Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Troubleshooting (requires SSH access — if none, open a new workflow run):**" >> $GITHUB_STEP_SUMMARY
          SITE="${{ inputs.site || 'portfolio' }}"
          echo "1. Deploy logs:     \`sudo ls -lt /var/log/${SITE}-deploy/ | head\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Service status:  \`sudo systemctl status ${SITE}\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Journal:         \`sudo journalctl -u ${SITE} --no-pager -n 80\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Current release: \`ls -la /opt/${SITE}/current\`" >> $GITHUB_STEP_SUMMARY
          echo "5. Release history: \`ls -lt /opt/${SITE}/releases/\`" >> $GITHUB_STEP_SUMMARY
          echo "6. Container:       \`sudo docker ps -a --filter name=${SITE}\`" >> $GITHUB_STEP_SUMMARY
          echo "7. nginx test:      \`sudo nginx -t\`" >> $GITHUB_STEP_SUMMARY
          echo "Note: if /etc/deploy/sites/${SITE}.conf sets SERVICE_NAME to a different value, replace ${SITE} in the commands above with that service name." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Rollback (if the automatic rollback didn't fire):**" >> $GITHUB_STEP_SUMMARY
          echo "Re-run the workflow on the last known-good SHA — the deploy script will flip the symlink back to that release dir if it's still on disk." >> $GITHUB_STEP_SUMMARY
