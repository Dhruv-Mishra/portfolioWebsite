name: Rollback Portfolio Production

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      rollback_to_sha:
        description: "Optional retained release SHA. Leave blank to use newest previous release per VM."
        required: false
        default: ""
        type: string
      site:
        description: "Production site config name"
        required: false
        default: portfolio
        type: string

concurrency:
  group: rollback-production-${{ inputs.site || 'portfolio' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DOMAIN: whoisdhruv.com

jobs:
  guard-production-ref:
    name: Guard production ref
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require deployed/production for rollback
        run: |
          if [ "${{ github.ref }}" != "refs/heads/deployed/production" ]; then
            echo "::error::Production rollback must run from refs/heads/deployed/production, not ${{ github.ref }}"
            exit 1
          fi

  approve-rollback:
    name: Approve production rollback
    needs: guard-production-ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://${{ env.DOMAIN }}
    steps:
      - name: Rollback approved
        run: echo "Production rollback approved."

  rollback-production:
    name: Roll back ${{ matrix.server.name }}
    needs: approve-rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        server:
          - name: production-1
            tts_mode: local
            host_secret: SERVER_HOST_1
            user_secret: SERVER_USERNAME_1
            key_secret: SERVER_SSH_KEY_1
            port_secret: SERVER_PORT_1
          - name: production-2
            tts_mode: remote
            host_secret: SERVER_HOST_2
            user_secret: SERVER_USERNAME_2
            key_secret: SERVER_SSH_KEY_2
            port_secret: SERVER_PORT_2
          - name: production-3
            tts_mode: remote
            host_secret: SERVER_HOST_3
            user_secret: SERVER_USERNAME_3
            key_secret: SERVER_SSH_KEY_3
            port_secret: SERVER_PORT_3

    environment:
      name: ${{ matrix.server.name }}
      url: https://${{ env.DOMAIN }}

    steps:
      - name: Validate rollback inputs
        env:
          SITE: ${{ inputs.site || 'portfolio' }}
          ROLLBACK_TO_SHA: ${{ inputs.rollback_to_sha }}
        run: |
          set -euo pipefail
          if [ "$SITE" != "portfolio" ]; then
            echo "::error::Production rollback only supports site=portfolio. Got: $SITE"
            exit 1
          fi
          if [ -n "$ROLLBACK_TO_SHA" ] && ! [[ "$ROLLBACK_TO_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::rollback_to_sha must be blank or a 7-40 character hexadecimal SHA."
            exit 1
          fi

      - name: Checkout deploy kit
        uses: actions/checkout@v4
        with:
          ref: deployed/production

      - name: Package deploy kit
        run: |
          set -euo pipefail
          mkdir -p deploy-kit
          cp portfolio/scripts/deploy.sh deploy-kit/deploy.sh
          cp portfolio/nginx-cloudflare.conf deploy-kit/nginx-cloudflare.conf
          tar czf portfolio-rollback-kit-${{ github.run_id }}.tar.gz -C deploy-kit .

      - name: Copy rollback kit to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          source: portfolio-rollback-kit-${{ github.run_id }}.tar.gz
          target: /tmp/
          timeout: 60s
          command_timeout: 3m

      - name: Roll back on ${{ matrix.server.name }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          SITE: ${{ inputs.site || 'portfolio' }}
          REQUESTED_SHA: ${{ inputs.rollback_to_sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          RUNTIME_HF_TOKEN: ${{ matrix.server.tts_mode == 'local' && secrets.PRODUCTION_HF_TOKEN || '' }}
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          command_timeout: 15m
          envs: SITE,REQUESTED_SHA,GHCR_OWNER,GHCR_READ_TOKEN,RUNTIME_HF_TOKEN
          script: |
            set -euo pipefail

            if [ "$SITE" != "portfolio" ]; then
              echo "ERROR: rollback site must be portfolio"
              exit 1
            fi
            if [ -n "$REQUESTED_SHA" ] && ! [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "ERROR: invalid rollback target: $REQUESTED_SHA"
              exit 1
            fi
            TTS_MODE="${{ matrix.server.tts_mode }}"
            SITE_CONF="/etc/deploy/sites/${SITE}.conf"
            ACTUAL_TTS_MODE="$(sudo awk -F= '$1 == "TTS_NODE_MODE" { value=$2; gsub(/^[ \t\"]+|[ \t\"]+$/, "", value); print value; exit }' "$SITE_CONF")"
            if [ "$ACTUAL_TTS_MODE" != "$TTS_MODE" ]; then
              echo "ERROR: TTS_NODE_MODE must match rollback matrix role $TTS_MODE, got ${ACTUAL_TTS_MODE:-unset}"
              exit 1
            fi
            if [ "$TTS_MODE" = "local" ] && [ -z "${RUNTIME_HF_TOKEN:-}" ]; then
              echo "ERROR: production Hugging Face runtime token is missing"
              exit 1
            fi

            KIT="/tmp/portfolio-rollback-kit-${{ github.run_id }}.tar.gz"
            STAGING="/tmp/portfolio-rollback-kit-${{ github.run_id }}"
            LOG="/tmp/${SITE}-rollback-${{ github.run_id }}.log"
            sudo rm -rf "$STAGING"
            sudo mkdir -p "$STAGING"
            sudo tar xzf "$KIT" -C "$STAGING"
            sudo chmod +x "$STAGING/deploy.sh"

            DOCKER_CONFIG_DIR=""
            cleanup() {
              local exit_code=$?
              trap - EXIT
              set +e
              sudo rm -rf "$STAGING" 2>/dev/null || true
              if [ -n "$DOCKER_CONFIG_DIR" ]; then
                sudo rm -rf "$DOCKER_CONFIG_DIR" 2>/dev/null || true
              fi
              exit "$exit_code"
            }
            trap cleanup EXIT

            DOCKER_CONFIG_DIR="$(mktemp -d)"
            sudo chmod 700 "$DOCKER_CONFIG_DIR"
            if [ -n "${GHCR_READ_TOKEN:-}" ]; then
              printf '%s' "$GHCR_READ_TOKEN" | sudo env DOCKER_CONFIG="$DOCKER_CONFIG_DIR" docker login ghcr.io \
                -u "$GHCR_OWNER" --password-stdin
            fi

            RUNTIME_ENV_FILE="/opt/${SITE}/config/.env.local"
            if ! sudo test -f "$RUNTIME_ENV_FILE"; then
              echo "ERROR: production runtime env file is missing: $RUNTIME_ENV_FILE"
              exit 1
            fi
            RUNTIME_ENV_TEMP="$(mktemp)"
            sudo awk -F= '$1 != "TTS_NODE_MODE" && $1 != "HF_TOKEN" && $1 != "HF_HOME" && $1 != "HF_HUB_CACHE" && $1 !~ /^LOCAL_TTS_/' \
              "$RUNTIME_ENV_FILE" > "$RUNTIME_ENV_TEMP"
            printf 'TTS_NODE_MODE=%s\n' "$TTS_MODE" >> "$RUNTIME_ENV_TEMP"
            if [ "$TTS_MODE" = "local" ]; then
              printf 'HF_TOKEN=%s\n' "$RUNTIME_HF_TOKEN" >> "$RUNTIME_ENV_TEMP"
              printf 'HF_HUB_CACHE=/var/cache/%s/pocket-tts\n' "$SITE" >> "$RUNTIME_ENV_TEMP"
              printf 'LOCAL_TTS_CACHE_DIR=/var/cache/%s/pocket-tts\n' "$SITE" >> "$RUNTIME_ENV_TEMP"
              printf 'LOCAL_TTS_VOICE_STATE_PATH=/var/cache/%s/pocket-tts/custom-dhruv.safetensors\n' "$SITE" >> "$RUNTIME_ENV_TEMP"
            fi
            RUNTIME_ENV_UID="$(sudo stat -c '%u' "$RUNTIME_ENV_FILE")"
            RUNTIME_ENV_GID="$(sudo stat -c '%g' "$RUNTIME_ENV_FILE")"
            RUNTIME_ENV_NEXT="${RUNTIME_ENV_FILE}.next.${{ github.run_id }}.$$"
            sudo install -m 600 -o "$RUNTIME_ENV_UID" -g "$RUNTIME_ENV_GID" "$RUNTIME_ENV_TEMP" "$RUNTIME_ENV_NEXT"
            rm -f "$RUNTIME_ENV_TEMP"
            sudo mv -f "$RUNTIME_ENV_NEXT" "$RUNTIME_ENV_FILE"
            echo "Synchronized rollback runtime settings for TTS role $TTS_MODE"

            if [ -n "$REQUESTED_SHA" ]; then
              rollback_args=(--site "$SITE" --rollback-to "$REQUESTED_SHA")
            else
              rollback_args=(--site "$SITE" --rollback)
            fi

            rollback_status=0
            sudo env DOCKER_CONFIG="$DOCKER_CONFIG_DIR" bash "$STAGING/deploy.sh" "${rollback_args[@]}" > "$LOG" 2>&1 || rollback_status=$?
            cat "$LOG" || true
            if [ "$rollback_status" -ne 0 ]; then
              latest_log=$(sudo find "/var/log/${SITE}-deploy" -name 'deploy-*.log' -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)
              if [ -n "$latest_log" ]; then
                echo "Latest deploy log: $latest_log"
                sudo tail -n 160 "$latest_log" || true
              fi
              exit "$rollback_status"
            fi
            exit 0

      - name: Verify rollback on ${{ matrix.server.name }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.user_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          port: ${{ secrets[matrix.server.port_secret] }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            SITE="${{ inputs.site || 'portfolio' }}"
            SITE_CONF="/etc/deploy/sites/${SITE}.conf"
            PORT="3000"
            if sudo test -f "$SITE_CONF"; then
              PORT="$(sudo awk -F= '$1 == "NEXTJS_PORT" { value=$2; gsub(/^[ \t\"]+|[ \t\"]+$/, "", value); print value; exit }' "$SITE_CONF")"
            fi
            TTS_MODE="$(sudo awk -F= '$1 == "TTS_NODE_MODE" { value=$2; gsub(/^[ \t\"]+|[ \t\"]+$/, "", value); print value; exit }' "$SITE_CONF")"
            [ "$TTS_MODE" = "${{ matrix.server.tts_mode }}" ] || { echo "TTS role mismatch: ${TTS_MODE:-unset}"; exit 1; }
            sudo systemctl is-active --quiet "$SITE"
            sudo nginx -t
            curl -sf -o /dev/null --max-time 5 "http://127.0.0.1:${PORT}/"
            TTS_STREAM_FILE="$(mktemp)"
            trap 'rm -f "$TTS_STREAM_FILE"' EXIT
            TTS_HTTP_CODE="$(curl -sk --max-time 300 --resolve "${{ env.DOMAIN }}:443:127.0.0.1" \
              -X POST -H "Accept: application/x-ndjson" -H "Content-Type: application/json" \
              -H "Origin: https://${{ env.DOMAIN }}" -H "Sec-Fetch-Site: same-origin" \
              --data '{"text":"Rollback topology verification.","stream":true}' \
              -o "$TTS_STREAM_FILE" -w "%{http_code}" "https://${{ env.DOMAIN }}/api/tts" 2>/dev/null || echo "000")"
            [ "$TTS_HTTP_CODE" = "200" ] || { echo "Pocket TTS HTTPS route returned HTTP $TTS_HTTP_CODE"; exit 1; }
            grep -q '"type":"ready"' "$TTS_STREAM_FILE" && grep -q '"type":"chunk"' "$TTS_STREAM_FILE" && grep -q '"type":"done"' "$TTS_STREAM_FILE" \
              || { echo "Pocket TTS HTTPS stream was incomplete"; exit 1; }
            if sudo test -f "/opt/${SITE}/current/.deploy/meta.json" && sudo grep -q '"image"' "/opt/${SITE}/current/.deploy/meta.json"; then
              sudo docker ps --format '{{.Names}}' | grep -qx "$SITE"
            fi
            CURRENT_SHA="$(basename "$(readlink -f "/opt/${SITE}/current")")"
            echo "Rollback verified on ${{ matrix.server.name }}: $CURRENT_SHA"

      - name: Rollback summary
        run: |
          echo "## ${{ matrix.server.name }} rollback complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested target: \`${{ inputs.rollback_to_sha || 'newest previous retained release' }}\`" >> "$GITHUB_STEP_SUMMARY"