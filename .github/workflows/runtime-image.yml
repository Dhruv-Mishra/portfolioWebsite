name: Runtime image

# Prebuilds the Dockerfile `runtime` stage (OS packages, Python, PyTorch) on native amd64 and arm64
# runners instead of under QEMU. The tag is a hash of that stage's text and requirements-tts.txt, so
# deploys reuse it until those inputs change. Callers pass the digest to the app build with
# `build-contexts: runtime=docker-image://<image_ref>`, which leaves the app build copy-only.

on:
  workflow_call:
    outputs:
      image_ref:
        description: Digest-pinned linux/amd64 + linux/arm64 runtime image.
        value: ${{ jobs.merge.outputs.image_ref || jobs.resolve.outputs.image_ref }}

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    name: Resolve runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      image_ref: ${{ steps.existing.outputs.digest && format('{0}@{1}', steps.meta.outputs.image, steps.existing.outputs.digest) || '' }}

    steps:
      - name: Checkout runtime inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            .github/actions/resolve-image-digest/
            portfolio/Dockerfile
            portfolio/requirements-tts.txt
          sparse-checkout-cone-mode: false

      - name: Hash runtime stage
        id: meta
        run: |
          set -euo pipefail
          dockerfile="$(tr -d '\r' < portfolio/Dockerfile)"
          stage="$(awk '/^FROM .* AS runtime$/ { keep = 1 } /^FROM / && !/ AS runtime$/ { keep = 0 } keep' <<< "$dockerfile")"
          if [ -z "$stage" ]; then
            echo "::error::portfolio/Dockerfile has no 'FROM ... AS runtime' stage"
            exit 1
          fi
          hash="$({ printf '%s\n' "$stage"; tr -d '\r' < portfolio/requirements-tts.txt; } | sha256sum | cut -c1-16)"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=runtime-${hash}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look up existing runtime image
        id: existing
        uses: ./.github/actions/resolve-image-digest
        with:
          ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  build:
    name: Build runtime image (${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.image_ref == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout runtime inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            portfolio/.dockerignore
            portfolio/Dockerfile
            portfolio/requirements-tts.txt
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: portfolio
          file: portfolio/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  merge:
    name: Publish runtime image
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform runtime tag
        id: publish
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:${TAG}"
          docker buildx imagetools create --tag "$ref" "${ref}-amd64" "${ref}-arm64"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::${ref} resolved to an invalid digest: ${digest:-empty}"
            exit 1
          fi
          platforms="$(docker buildx imagetools inspect "${IMAGE}@${digest}" | awk '/^[[:space:]]*Platform: / { print $2 }')"
          for platform in linux/amd64 linux/arm64; do
            if ! grep -Fxq "$platform" <<< "$platforms"; then
              echo "::error::${ref} is missing required platform ${platform}"
              exit 1
            fi
          done
          echo "image_ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
