name: Validate native runtime build (temporary)

# Temporary branch-only validation for perf/native-arm-host-network; publishes nothing.
on:
  push:
    branches:
      - perf/native-arm-host-network
    paths:
      - .github/workflows/validate-native-build.yml

permissions:
  contents: read
  packages: read

jobs:
  resolve-and-ghcr-context:
    name: Resolve action + GHCR runtime context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sparse checkout as runtime-image.yml resolve job
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            .github/actions/resolve-image-digest/
            portfolio/Dockerfile
            portfolio/requirements-tts.txt
          sparse-checkout-cone-mode: false
      - name: Show sparse tree
        run: find . -path ./.git -prune -o -type f -print
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Existing tag
        id: found
        uses: ./.github/actions/resolve-image-digest
        with:
          ref: ghcr.io/dhruv-mishra/portfoliowebsite:0cfad84f90d0d4601cf36332fe584432b3174323
      - name: Missing tag
        id: missing
        uses: ./.github/actions/resolve-image-digest
        with:
          ref: ghcr.io/dhruv-mishra/portfoliowebsite:runtime-0000000000000000
      - name: Assert lookups
        env:
          FOUND: ${{ steps.found.outputs.digest }}
          MISSING: ${{ steps.missing.outputs.digest }}
          IMAGE_REF: ${{ steps.found.outputs.digest && format('{0}@{1}', 'ghcr.io/dhruv-mishra/portfoliowebsite', steps.found.outputs.digest) || '' }}
          EMPTY_REF: ${{ steps.missing.outputs.digest && format('{0}@{1}', 'ghcr.io/dhruv-mishra/portfoliowebsite', steps.missing.outputs.digest) || '' }}
        run: |
          set -euo pipefail
          echo "found=${FOUND} missing='${MISSING}' image_ref=${IMAGE_REF} empty_ref='${EMPTY_REF}'"
          [[ "$FOUND" =~ ^sha256:[0-9a-f]{64}$ ]]
          [ -z "$MISSING" ]
          [ -z "$EMPTY_REF" ]
          [ "$IMAGE_REF" = "ghcr.io/dhruv-mishra/portfoliowebsite@${FOUND}" ]
      - name: Full checkout for app build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: full
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Multi-arch app build on a GHCR runtime context (no QEMU)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: full/portfolio
          file: full/portfolio/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-contexts: |
            runtime=docker-image://ghcr.io/dhruv-mishra/portfoliowebsite@${{ steps.found.outputs.digest }}
          build-args: |
            NEXT_BUILD_ID=validate
            NEXT_EXTERNAL_TYPECHECK=1

  arm64-image-smoke:
    name: arm64 image smoke (native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: portfolio
          file: portfolio/Dockerfile
          platforms: linux/arm64
          load: true
          tags: portfolio:validate
          build-args: |
            NEXT_BUILD_ID=validate
            NEXT_EXTERNAL_TYPECHECK=1
      - name: Run with deploy.sh flags and probe
        run: |
          set -euo pipefail
          printf 'SITE_URL=http://127.0.0.1:3999\n' > /tmp/validate.env
          docker run -d --name portfolio-validate --pull=never \
            --env-file /tmp/validate.env \
            --env NODE_ENV=production --env PORT=3999 --env HOSTNAME=127.0.0.1 \
            --env NODE_OPTIONS=--max-old-space-size=350 --env TTS_NODE_MODE=remote \
            --network host --memory 1536m --memory-reservation 1200m --cpus 0.90 \
            portfolio:validate
          for i in $(seq 1 30); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:3999/; then break; fi
            sleep 1
          done
          uname -m
          docker image inspect --format '{{.Architecture}}' portfolio:validate
          sudo ss -tlnp 'sport = :3999'
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/)"
          echo "GET / -> ${code}"
          [ "$code" = "200" ]
          docker exec portfolio-validate sh -c 'id; /opt/tts-venv/bin/python -c "import platform, torch, pocket_tts, soundfile; print(platform.machine(), torch.__version__)"'
          docker inspect --format '{{.State.Health.Status}}' portfolio-validate || true
