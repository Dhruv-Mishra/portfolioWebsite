# Public TLS endpoint for the local LLM. Cloudflare proxies llm.whoisdhruv.com to this VM.
# Requests go to llm-gateway (bounded FIFO queue) and then to llama-server on loopback.

upstream llm_gateway {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name llm.whoisdhruv.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name llm.whoisdhruv.com;

    ssl_certificate /etc/letsencrypt/live/llm.whoisdhruv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.whoisdhruv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LlmSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/llm.access.log;
    error_log /var/log/nginx/llm.error.log;

    client_max_body_size 8m;
    client_body_timeout 60s;

    # Operational endpoints stay loopback-only.
    location ~ ^/(gateway/|metrics|slots) {
        return 404;
    }

    location / {
        proxy_pass http://llm_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no" always;
    }
}
